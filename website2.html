<!DOCTYPE html>
<html>
<head>
    <title>Serial Monitor Read Test</title>
</head>
<body>

    <h1>USB Test Arduino Read</h1>
    <p>Click below to grant the browser direct access to your USB port to read Arduino.</p>
    <button onclick="connectArduino()">Connect Arduino</button>
    
    <div id="box">Disconnected</div>

    <script>
        async function connectArduino() {
            if (!("serial" in navigator)) {
                alert("Web Serial API is not supported in this browser. Please use Chrome or Edge.");
                return;
            }

            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                document.getElementById('box').innerText = "Connected! Waiting for data...";

                // Transform raw stream into line-by-line chunks
                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                
                const lineStream = textDecoder.readable.pipeThrough(new LineBreakTransformer());
                const reader = lineStream.getReader();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) {
                        reader.releaseLock();
                        break;
                    }
                    if (value && value.trim() !== "") {
                        console.log("Full line received:", value);
                        document.getElementById('box').innerText = value.trim();
                    }
                }
            } catch (error) {
                console.error("Connection failed:", error);
                document.getElementById('box').innerText = "Connection Error";
            }
        }

        // Helper class to buffer stream until a newline character (\n) is received
        class LineBreakTransformer {
            constructor() {
                this.container = "";
            }

            transform(chunk, controller) {
                this.container += chunk;
                const lines = this.container.split("\n");
                this.container = lines.pop(); // Keep incomplete line in buffer
                for (const line of lines) {
                    controller.enqueue(line);
                }
            }

            flush(controller) {
                if (this.container) {
                    controller.enqueue(this.container);
                }
            }
        }
    </script>
</body>
</html>
