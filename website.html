<!DOCTYPE html>
<html>
<head>
    <title>serial monitor read idk test</title>
</head>
<body>

    <h1>usb test arduino test</h1>
    <p>Click below to grant the browser direct access to your USB port to read arduino.</p>
    <button onclick="connectArduino()">Connect Arduino</button>
    
    <div id="box">Disconnected</div>

    <script>
        async function connectArduino() {
            // 1. Validate if Web Serial is supported by the user's browser
            if (!("serial" in navigator)) {
                alert("Web Serial API is not supported in this browser. Please use Google Chrome or MS Edge.");
                return;
            }

            try {
                // prompt user to select their Arduino 
                const port = await navigator.serial.requestPort();

                await port.open({ baudRate: 9600 });
                document.getElementById('box').innerText = "Connected! Waiting for data...";

                const reader = port.readable.getReader();
                while (true) {
                    const { value, done } = await reader.read();
                    console.log("New Value: ", value);

                }

            } catch (error) {
                console.error("Connection failed:", error);
                document.getElementById('box').innerText = "Connection Error";
            }
        }
    </script>
</body>
</html>
